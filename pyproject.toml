[project]
name = "archival"
version = "0.0.1"
authors = [
    {name = "Alex Levy", email = "ajlevy246@gmail.com"},
]
description = "Semantic search index for a subset of the ArXiv pre-print repository."
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "MIT"
license-files = ["LICENSE.txt"]
dependencies = [
    "sickle",
    "numpy",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "pyright",
]
ingest = [
    "sentence-transformers",
    "torchvision",
    "Pillow",
]

[project.urls]
homepage = "https://github.com/ajlevy246/archival"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.coverage.run]
source = ["archival"]

[tool.coverage.report]
show_missing = true
skip_covered = true